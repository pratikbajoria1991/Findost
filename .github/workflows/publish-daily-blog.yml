name: Publish daily Findost research brief

on:
  schedule:
    # 06:00 Asia/Kolkata (00:30 UTC) every day
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish daily cited educational post
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create a cited research brief
        shell: python
        run: |
          from datetime import datetime
          from pathlib import Path
          from urllib.request import Request, urlopen
          from xml.etree import ElementTree as ET
          from zoneinfo import ZoneInfo
          import html
          import re

          def fetch(url: str) -> bytes:
              request = Request(url, headers={"User-Agent": "FindostResearchBot/1.0 (+https://findost.io)"})
              with urlopen(request, timeout=30) as response:
                  return response.read()

          def clean(value: str) -> str:
              return re.sub(r"\s+", " ", html.unescape(value or "")).strip()

          root = Path(".")
          today = datetime.now(ZoneInfo("Asia/Kolkata")).date().isoformat()
          destination = root / "content" / "blog" / f"daily-{today}.md"

          if destination.exists():
              print(f"{destination} already exists; nothing to publish.")
              raise SystemExit(0)

          # Official, public first-party regulatory source. No scraping of search results,
          # paywalled material, or social platforms is used in automatic publication.
          try:
              feed = ET.fromstring(fetch("https://www.sebi.gov.in/sebirss.xml"))
          except Exception as error:
              raise SystemExit(f"SEBI RSS retrieval failed; no post published: {error}")

          items = []
          for item in feed.findall(".//item")[:3]:
              title = clean(item.findtext("title"))
              link = clean(item.findtext("link"))
              published = clean(item.findtext("pubDate"))
              if title and link:
                  items.append((title, link, published))

          if not items:
              raise SystemExit("SEBI RSS had no usable items; no post published.")

          sources = sorted(
              path for path in (root / "content" / "training").glob("*.md")
              if path.name.lower() != "readme.md"
          )
          if not sources:
              raise SystemExit("No Findost training-library source files found.")

          source = sources[datetime.now(ZoneInfo("Asia/Kolkata")).timetuple().tm_yday % len(sources)]
          raw = source.read_text(encoding="utf-8")
          match = re.match(r"^---\s*\n([\s\S]*?)\n---\s*\n([\s\S]*)$", raw)
          if not match:
              raise SystemExit(f"{source} is missing front matter.")

          frontmatter, body = match.groups()
          topic_match = re.search(r"^topic:\s*(.+)$", frontmatter, re.MULTILINE)
          topic = topic_match.group(1).strip() if topic_match else "Personal finance learning note"
          english_body = re.split(r"\n\[(?:hi|bn|mr|te|ta|gu|ur|kn|or|ml)\]\s*\n", body)[0].strip()

          citations = "\n".join(
              f"- [{title}]({link})" + (f" — {published}" if published else "")
              for title, link, published in items
          )

          destination.write_text(
              f"""---\ntitle: "India Finance Research Brief: {topic}"\ndate: {today}\ndescription: "A cited educational research brief from Findost, with official regulatory-source links and an explainer on {topic}."\nauthor: "Findost Editorial Desk"\n---\n\n## Official regulatory updates to review\n\n{citations}\n\nFindost links to the primary source so readers can verify the underlying announcement before forming a view.\n\n## Educational explainer: {topic}\n\n{english_body}\n\n## Sources and scope\n\n- [SEBI RSS feed](https://www.sebi.gov.in/sebirss.xml)\n- [RBI RSS catalogue](https://www.rbi.org.in/Scripts/rss.aspx)\n\n*This automatically published brief combines public, first-party regulatory links with Findost educational material. It is not personalised investment, tax, or legal advice, and it does not recommend securities or products. Verify source updates and consult a qualified professional before acting.*\n""",
              encoding="utf-8",
          )
          print(f"Created {destination}")

      - name: Commit and push when a new post was created
        run: |
          if git diff --quiet; then
            echo "No new post to commit."
            exit 0
          fi
          git config user.name "findost-content-bot"
          git config user.email "actions@github.com"
          git add content/blog/daily-*.md
          git commit -m "content: publish daily cited research brief"
          git push
