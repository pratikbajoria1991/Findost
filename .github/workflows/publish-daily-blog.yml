name: Publish daily Findost research brief

on:
  schedule:
    # 06:00 Asia/Kolkata (00:30 UTC) every day
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish daily cited educational post
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create a cited research brief
        shell: python
        run: |
          from datetime import datetime
          from pathlib import Path
          from urllib.request import Request, urlopen
          from xml.etree import ElementTree as ET
          from zoneinfo import ZoneInfo
          import html
          import re

          def fetch(url: str) -> bytes:
              request = Request(url, headers={"User-Agent": "FindostResearchBot/1.0 (+https://findost.io)"})
              with urlopen(request, timeout=30) as response:
                  return response.read()

          def clean(value: str) -> str:
              return re.sub(r"\s+", " ", html.unescape(value or "")).strip()

          def feed_items(url: str, label: str) -> list[tuple[str, str, str, str]]:
              feed = ET.fromstring(fetch(url))
              result = []
              for item in feed.findall(".//item")[:3]:
                  title = clean(item.findtext("title"))
                  link = clean(item.findtext("link"))
                  published = clean(item.findtext("pubDate"))
                  if title and link:
                      result.append((label, title, link, published))
              if not result:
                  raise ValueError(f"{label} RSS had no usable items")
              return result

          root = Path(".")
          today = datetime.now(ZoneInfo("Asia/Kolkata")).date().isoformat()
          destination = root / "content" / "blog" / f"daily-{today}.md"

          if destination.exists():
              print(f"{destination} already exists; nothing to publish.")
              raise SystemExit(0)

          # Primary, public regulatory sources only. The workflow does not scrape
          # search-result pages, use paywalled material, or publish social-media claims.
          try:
              updates = (
                  feed_items("https://www.sebi.gov.in/sebirss.xml", "SEBI")
                  + feed_items("https://rbi.org.in/pressreleases_rss.xml", "RBI")
              )
          except Exception as error:
              raise SystemExit(f"Official-source retrieval failed; no post published: {error}")

          sources = sorted(
              path for path in (root / "content" / "training").glob("*.md")
              if path.name.lower() != "readme.md"
          )
          if not sources:
              raise SystemExit("No Findost training-library source files found.")

          source = sources[datetime.now(ZoneInfo("Asia/Kolkata")).timetuple().tm_yday % len(sources)]
          raw = source.read_text(encoding="utf-8")
          match = re.match(r"^---\s*\n([\s\S]*?)\n---\s*\n([\s\S]*)$", raw)
          if not match:
              raise SystemExit(f"{source} is missing front matter.")

          frontmatter, body = match.groups()
          topic_match = re.search(r"^topic:\s*(.+)$", frontmatter, re.MULTILINE)
          topic = topic_match.group(1).strip() if topic_match else "Personal finance learning note"
          english_body = re.split(r"\n\[(?:hi|bn|mr|te|ta|gu|ur|kn|or|ml)\]\s*\n", body)[0].strip()

          citations = "\n".join(
              f"- **{publisher}:** [{title}]({link})" + (f" — {published}" if published else "")
              for publisher, title, link, published in updates
          )

          destination.write_text(
              f"""---\ntitle: "India Finance Research Brief: {topic}"\ndate: {today}\ndescription: "A cited Findost research brief using official RBI and SEBI updates, with an educational explainer on {topic}."\nauthor: "Findost Editorial Desk"\n---\n\n## Official updates to review\n\n{citations}\n\nFindost links to primary sources so readers can verify the underlying announcement before forming a view.\n\n## Educational explainer: {topic}\n\n{english_body}\n\n## Sources and scope\n\n- [SEBI RSS feed](https://www.sebi.gov.in/sebirss.xml)\n- [RBI press-release RSS feed](https://rbi.org.in/pressreleases_rss.xml)\n\n*This automatically published brief combines public first-party regulatory links with Findost educational material. It is not personalised investment, tax, or legal advice, and it does not recommend securities or products. Verify source updates and consult a qualified professional before acting.*\n""",
              encoding="utf-8",
          )
          print(f"Created {destination}")

      - name: Commit and push when a new post was created
        run: |
          if git diff --quiet; then
            echo "No new post to commit."
            exit 0
          fi
          git config user.name "findost-content-bot"
          git config user.email "actions@github.com"
          git add content/blog/daily-*.md
          git commit -m "content: publish daily cited research brief"
          git push
